name: Deploy Production

# Release is explicit: backup/migrate first, dashboard API then SPA deploy, verify last.
on:
  workflow_dispatch:
    inputs:
      action:
        description: Production maintenance step
        required: true
        type: choice
        options: [migrate, verify]
      revision:
        description: Reviewed commit SHA to migrate or verify
        required: true
        type: string

concurrency:
  group: production-maintenance
  cancel-in-progress: false

# Required repository secrets (production environment):
#   PROD_DATABASE_URL        - live database connection string
#   BACKUP_ENCRYPTION_KEY    - symmetric passphrase for GPG AES-256
#   PROD_SUPABASE_URL        - e.g. https://<project>.supabase.co
#   PROD_SUPABASE_SERVICE_KEY- service role key (storage write access)
#   PROD_SPA_URL             - e.g. https://ata-lta-erp-spa-main.onrender.com
# The pre-migration backup lands in the private Supabase Storage bucket
# 'erp-db-backups'. It is never uploaded as an unencrypted CI artifact.

jobs:
  backup-before-migrate:
    if: inputs.action == 'migrate'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - name: Install PostgreSQL 17 Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
      - name: Dump, Encrypt and Upload Pre-Migration Backup
        run: |
          set -euo pipefail
          FILE="backup-before-migration-$(date +%Y%m%d-%H%M%S).sql.gpg"
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --no-owner --no-acl --clean --if-exists \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_KEY" \
            > "$FILE"
          echo "Encrypted backup written: $FILE ($(du -h "$FILE" | cut -f1))"
          curl -fsS -X POST \
            "${SUPABASE_URL}/storage/v1/object/${BACKUP_BUCKET}/${FILE}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "x-upsert: false" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${FILE}"
          rm -f "$FILE"
          echo "Uploaded to Supabase Storage bucket '${BACKUP_BUCKET}': $FILE"
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          BACKUP_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_KEY }}
          BACKUP_BUCKET: erp-db-backups

  migrate-prod:
    needs: backup-before-migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: node scripts/migrate-remote.js prod
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_KEY }}

  smoke-prod:
    if: inputs.action == 'verify'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify reviewed React deployment without writes
        run: |
          export EXPECTED_COMMIT="$(git rev-parse HEAD)"
          node scripts/smoke-react.js main
        env:
          BASE_URL: ${{ secrets.PROD_SPA_URL }}
          EXPECTED_SUPABASE_URL: https://nohelmujoswmmqedgern.supabase.co
