# Main production services. Top-level declarations preserve existing project/environment placement.
# Backend-only erp-main-secrets must already exist in the API service's environment:
# SUPABASE_URL, SUPABASE_SERVICE_KEY, SUPABASE_STORAGE_BUCKET, DATABASE_URL.
# Set the two public-key variables manually before syncing existing services.
# sync: false never stores their values in Git and does not prompt on subsequent syncs.
# Apply pending production migrations before a sync that redeploys these services.
services:
  - type: web
    name: ata-lta-erp-api-main
    runtime: docker
    region: singapore
    plan: free
    repo: https://github.com/jevvii/ata-lta-erp-final-render.git
    branch: main
    autoDeployTrigger: "off"
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /readyz
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: RESERVATION_STORE_DRIVER
        value: database
      - key: FRONTEND_URL
        value: https://ata-lta-erp-spa-main.onrender.com
      - key: SUPABASE_ANON_KEY
        sync: false
      - fromGroup: erp-main-secrets
  - type: web
    name: ata-lta-erp-spa-main
    runtime: static
    repo: https://github.com/jevvii/ata-lta-erp-final-render.git
    branch: main
    autoDeployTrigger: "off"
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ERP_API_BASE_URL
        value: https://ata-lta-erp-api-main.onrender.com/v1
      - key: VITE_SUPABASE_URL
        value: https://nohelmujoswmmqedgern.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
