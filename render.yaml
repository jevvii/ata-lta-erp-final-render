# ATA & LTA ERP — Render Blueprint (Main / Production Deployment)
# Deploys the main backend and SPA into "My project".
#
# PREREQUISITE: Create the "erp-main-secrets" environment group manually in the
# Render dashboard under My project -> main -> Environment Groups, using these
# exact key names:
#   SUPABASE_URL
#   SUPABASE_SERVICE_KEY
#   SUPABASE_STORAGE_BUCKET
#   DATABASE_URL
#
# If an "erp-main-secrets" group already exists anywhere else, delete it first to
# avoid the "same environment" linking error.
#
# Do NOT store secret values in this file.

projects:
  - name: My project
    environments:
      - name: uat
        services:
          # ─── Backend ────────────────────────────────────────────────
          - type: web
            name: ata-lta-erp-api-main
            runtime: docker
            region: singapore
            plan: free
            repo: https://github.com/jevvii/ata-lta-erp-final-render.git
            branch: main
            rootDir: backend
            dockerfilePath: Dockerfile
            healthCheckPath: /health
            envVars:
              - key: NODE_ENV
                value: production
              - key: LOG_LEVEL
                value: info
              - key: FRONTEND_URL
                value: https://ata-lta-erp-spa-main.onrender.com
              - fromGroup: erp-main-secrets

          # ─── Frontend Static Site ──────────────────────────────────
          # Static sites on Render are free by default; do not set `plan`.
          - type: web
            name: ata-lta-erp-spa-main
            runtime: static
            repo: https://github.com/jevvii/ata-lta-erp-final-render.git
            branch: main
            rootDir: erp_prototype
            buildCommand: npm run build
            staticPublishPath: .
            envVars:
              - key: ERP_API_BASE_URL
                value: https://ata-lta-erp-api-main.onrender.com/v1
