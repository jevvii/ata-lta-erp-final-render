<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATA &amp; LTA ERP</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #F8FAFC; font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #0F172A; padding: 20px;">
        <div style="width: 56px; height: 56px; border-radius: 8px; background: #FFFFFF; box-shadow: 0px 1px 2px 0px rgba(15, 23, 42, 0.04); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; border: 1px solid #CBD5E1;">
          <div style="width: 24px; height: 24px; border: 3px solid #CBD5E1; border-top-color: #1D4ED8; border-radius: 50%; animation: boot-spin 0.8s linear infinite;"></div>
        </div>
        <div style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 6px; color: #0F172A;">ATA &amp; LTA Accounting Firm ERP</div>
        <div style="font-size: 12px; font-family: 'Inter', system-ui, -apple-system, sans-serif; letter-spacing: 0.01em; color: #475569; margin-bottom: 24px;">System Initialization &middot; Enterprise Ledger</div>
        <div style="width: 220px; height: 6px; background: #F1F5F9; border: 1px solid #CBD5E1; border-radius: 999px; overflow: hidden;">
          <div style="width: 100%; height: 100%; background: #1D4ED8; border-radius: 999px; animation: boot-shimmer 1.5s ease-in-out infinite;"></div>
        </div>
        <style>
          @keyframes boot-spin { to { transform: rotate(360deg); } }
          @keyframes boot-shimmer {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(0%); }
            100% { transform: translateX(100%); }
          }
          @media (prefers-reduced-motion: reduce) {
            #boot-loader * { animation: none !important; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
